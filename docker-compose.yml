services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: kinosearch
      POSTGRES_USER: kinosearch
      POSTGRES_PASSWORD: kinosearch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinosearch -d kinosearch"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
